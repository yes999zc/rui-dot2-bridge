[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rui-dot2-bridge"
version = "0.2.0"
description = "Echo Dot 2 as a rui satellite: Socket & Plug v1 adapter for the EchoMuse device protocol"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "websockets>=13",
]

[project.optional-dependencies]
# rui itself is supplied by the official image (the plug runs in-process there);
# do not add it here: the PyPI `rui` project is unrelated. See README/tests notes.
dev = ["pytest>=8", "PyYAML>=6", "ruff>=0.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Ship the v1 manifest with the package: rui device/loader.py discovers
# plugin.yaml next to the adapter module, and the downstream image copies only
# this package directory. Without package-data an sdist/wheel would drop it.
[tool.setuptools.package-data]
rui_dot2_bridge = ["plugin.yaml", "devices/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # same as rui's own config; long lines are reviewed, not fought

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
