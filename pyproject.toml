[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rui-dot2-bridge"
version = "0.1.0"
description = "Echo Dot 2 as a rui satellite: device-protocol adapter that replaces the EchoMuse controller"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # same as rui's own config; long lines are reviewed, not fought

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
