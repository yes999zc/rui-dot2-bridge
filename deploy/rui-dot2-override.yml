# rui + dot2 adapter on the NAS: compose override
#
# Run this **next to** rui's own `docker-compose.yml` (same directory), never editing
# the rui checkout, its image or its source:
#
#     cd <rui-deploy-dir>            # the dir with docker-compose.yml + config/ + data/
#     DOT2_REPO_DIR=/path/to/rui-dot2-bridge \
#       docker compose -f docker-compose.yml -f rui-dot2-override.yml up -d
#
# The service name matches upstream (`rui`, 0.2+). Everything else comes from rui's
# own compose file (host network, restart policy, healthcheck). The paths below are
# operator-owned; the repo never carries a real host path.

services:
  rui:
    volumes:
      # src/ goes in as a PYTHONPATH root: it contains both rui_dot2_bridge/ and
      # sitecustomize.py, so the adapter registers itself in the parent process
      # AND in the audio-plane child (which is `python -m rui.audio.process`).
      - ${DOT2_REPO_DIR:-/opt/rui-dot2-bridge}/src:/opt/rui-py:ro
      # ca.pem / server.pem / server.key / device_token, mode 0600, never in git.
      - ${DOT2_REPO_DIR:-/opt/rui-dot2-bridge}/secrets:/opt/rui-secrets:ro
    environment:
      PYTHONPATH: /opt/rui-py
      DOT2_SECRETS_DIR: /opt/rui-secrets
      # Ceiling on the device's own dB-linear scale (0.5 dB/step, 127 = 0 dB).
      # 30 % was the overnight rule and turned out to be -44.5 dB (inaudible);
      # the owner approved 100 % (level 127, unity) on 2026-10-24.
      DOT2_VOLUME_CAP: "100"
      DOT2_AEC_ENABLED: "1"        # stock device AEC on; 0 only for acoustic-loop tests
      # Loudness: EQ_50..EQ_100 curves live in eq/ next to secrets/ (vendor files,
      # pulled read-only from the device; see docs/loudness-eq.md).
      DOT2_EQ_DIR: /opt/rui-secrets/eq
      DOT2_LOUDNESS_FILE: /opt/rui-secrets/loudness.json
      DOT2_MIC_GAIN_DB: "18"       # device default 24 clips normal speech
      DOT2_CONTROL_PORT: "8872"    # loopback tuning API for rui's backend
      # No DOT2_INJECT_PORT / DOT2_RECORD: those are dev-only hooks.
