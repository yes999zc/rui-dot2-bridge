schema: rui-device/v1
id: dot2
model: "RS03QR"
name: "Echo Dot 2 (EchoMuse firmware)"
vendor: "Amazon / EchoMuse"
class: B
transport: inbound
protocol: {kind: wss, version: "1"}
capabilities: [playback, led, volume, keys, device_wake, barge_via_device]
wake: {source: device, barge_via_device: true}
# Hardware audio defaults (rui-device/v1, rui 0.6 `audio_defaults`): the bottom
# layer of the three-layer merge (manifest < global config < devices[].audio).
# The stock Dot 2 captures mono 16 kHz S16 with no playback reference; the speaker
# wire is 48 kHz mono. ack_echo_ignore_ms=2500 keeps the echo window working on
# 0.6 without a deployment-side override.
audio_defaults:
  capture: {rate: 16000, channels: 1, mic_channels: 1, ref_channels: 0, bits: 16}
  playback: {rate: 48000, channels: 1}
  ack_echo_ignore_ms: 2500
device_side:
  artifact: firmware
  name: "EchoMuse device firmware (RS03QR)"
  source: "https://github.com/yes999zc/echomuse-dot2-ref"
  version_min: "v2.18.1"
  install_steps:
    - "Unlock the Dot 2 and install the EchoMuse device firmware (v2.18.1 or newer)."
    - "Keep the existing EchoMuse TLS material and X-EM-Token; the adapter reuses them unchanged."
    - "Configure the same wake words as RUI on the device (see params.wake_words)."
    - "Enable on-device wake only after pushing a matching OWW model; stock firmware has no model for these words."
  rollback: "Boot the original firmware slot (server_a) from the device A/B partitions and point its controller URL back at the previous EchoMuse controller."
runtime: {mode: in-process, entrypoint: "rui_dot2_bridge.adapter:build", listen_port: 8870, token_env: DOT2_EM_TOKEN}
params:
  - {key: host, label: "音箱地址", type: string, required: true, placeholder: "<speaker-host>"}
  - {key: room, label: "房间名", type: string, default: "客厅"}
  - {key: wake_words, label: "唤醒词", type: list, default: ["你好小瑞"], max: 3}
  - {key: port, label: "入站端口", type: int, default: 8870, help: "EchoMuse wss listen port; the device dials this port."}
  - {key: oww_model, label: "设备端唤醒模型", type: string, default: "", help: "Only set when a matching OWW model was pushed to the device; empty keeps RUI KWS."}
  # Per-device runtime knobs (C-001). Empty string means "inherit": the adapter
  # falls back to DOT2_* env, then to the device-level default; control_port 0
  # keeps the loopback loudness API off, so a second plane cannot claim the port.
  - {key: control_port, label: "响度控制端口", type: int, default: 0, help: "Loopback loudness API on 127.0.0.1; 0 disables it. Give every plane a unique port (or 0)."}
  - {key: loudness_file, label: "响度状态文件", type: string, default: "", help: "Writable loudness state; empty = dev/rui/<device id>/loudness.json (isolated per device)."}
  - {key: eq_dir, label: "EQ 曲线目录", type: string, default: "", help: "Read-only vendor EQ_*.cfg directory; empty = shared default (artifacts/eq-prototype, else secrets/eq)."}
  - {key: secrets_dir, label: "凭据目录", type: string, default: "", help: "TLS material and device_token; empty = DOT2_SECRETS_DIR, then secrets/<device id> when present, else secrets."}
  - {key: oww_threshold, label: "设备端唤醒阈值", type: string, default: "", help: "Device-side OWW score threshold; empty keeps the firmware default (0.5)."}
compatibility: {rui_min: "0.3.0", tested_with: ["0.3.4", "0.4.0", "0.4.1", "0.4.2", "0.5.0", "0.5.1", "0.5.2", "0.6.0", "0.7.9"], notes: "device_wake is opt-in: it needs a device-side OWW model for the configured wake words; no reference channel (device AEC); audio_defaults (0.6+) declares the mono 16 kHz capture, 48 kHz playback and the 2500 ms ack echo window."}
acceptance: {verified: false, last_verified: "", evidence: "Contract kit report: artifacts/contract-report.json (rui 0.3.4). Live-device acceptance pending."}
