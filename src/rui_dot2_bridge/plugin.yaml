schema: rui-plugin/v0
id: dot2-echomuse
name: "Echo Dot 2 (EchoMuse) plug"
version: 1.3.2
# B3a dual window: one range spans the 0.7.x and 0.8.x release lines instead of a
# single minor. loader.py compares rui.__version__ against this range and refuses
# out-of-range manifests, which would leave every Dot 2 without an adapter, so the
# ceiling must already cover the next minor before it ships.
rui_compat: ">=0.7.0 <0.9.0"
license: MIT
maintainer: "Bakey Zhang"
homepage: "https://github.com/yes999zc/rui-dot2-bridge"
trust: trusted
devices:
  - devices/rs03qr.yaml
